<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Kansas Extension History Map</title>

<!-- Leaflet -->
<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<!-- Marker Cluster -->
<link rel="stylesheet"
href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>

<link rel="stylesheet"
href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>

<!-- Your CSS -->
<link rel="stylesheet" href="style.css">

<style>
/* Minimal layout fallback if style.css is missing */

body {
    margin: 0;
    display: flex;
    font-family: Arial, sans-serif;
}

#sidebar {
    width: 340px;
    height: 100vh;
    overflow-y: auto;
    padding: 15px;
    background: #f5f5f5;
    border-right: 1px solid #ddd;
}

#map {
    flex: 1;
    height: 100vh;
}

input, select {
    width: 100%;
    padding: 6px;
    margin-bottom: 10px;
}

.result-item {
    background: white;
    padding: 10px;
    margin-bottom: 8px;
    border: 1px solid #ddd;
    cursor: pointer;
}

.result-item:hover {
    background: #eee;
}

#legend {
    margin-top: 10px;
    padding: 10px;
    background: white;
    border: 1px solid #ccc;
}

#legend img {
    width: 20px;
    vertical-align: middle;
    margin-right: 6px;
}

#detailsPanel {
    margin-top: 15px;
    padding: 10px;
    background: white;
    border: 1px solid #ccc;
}
</style>

</head>

<body>

<!-- ========================= -->
<!-- SIDEBAR -->
<!-- ========================= -->
<div id="sidebar">

<h2>Kansas Extension Map</h2>

<!-- SEARCH -->
<input id="search" type="text" placeholder="Search events">

<!-- COUNTY FILTER -->
<select id="countyFilter">
<option value="all">All Counties</option>
</select>

<!-- CATEGORY FILTER -->
<select id="categoryFilter">
<option value="all">All Categories</option>
</select>

<!-- YEAR SLIDER -->
<label>
Year: <span id="yearValue">2025</span>
</label>

<input id="yearSlider"
type="range"
min="1900"
max="2025"
value="2025">

<!-- LEGEND TOGGLE -->
<button id="toggleLegend">Toggle Legend</button>

<!-- LEGEND -->
<div id="legend">

<h3>Categories</h3>

<div><img src="images/wildlife.svg"> Wildlife</div>
<div><img src="images/crop.svg"> Crop</div>
<div><img src="images/livestock.svg"> Livestock</div>
<div><img src="images/farmersmarket.svg"> Farmers Market</div>
<div><img src="images/youth.svg"> Youth</div>
<div><img src="images/ageconomics.svg"> Ag Economics</div>

</div>

<!-- RESULTS -->
<h3>Results</h3>
<div id="results"></div>

<!-- DETAILS PANEL -->
<div id="detailsPanel">
<h3>Select an Event</h3>
<p>Click a result or map point to see details.</p>
</div>

</div>

<!-- ========================= -->
<!-- MAP -->
<!-- ========================= -->
<div id="map"></div>

<!-- ========================= -->
<!-- LIBRARIES -->
<!-- ========================= -->

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<!-- YOUR SCRIPT -->
<script src="script.js"></script>

</body>
</html>
