<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Kansas Extension Map</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- MOBILE HEADER -->
<div id="mobileHeader">
    <button id="menuToggle">☰ Menu</button>
    <h3>Kansas Extension Map</h3>
</div>

<!-- SIDEBAR -->
<div id="sidebar">

<h2>Kansas Extension Map</h2>

<input id="search" placeholder="Search events">

<select id="countyFilter">
<option value="all">All Counties</option>
</select>

<select id="categoryFilter">
<option value="all">All Categories</option>
</select>

<label>Year: <span id="yearValue">2025</span></label>
<input id="yearSlider" type="range" min="1900" max="2025" value="2025">

<button id="toggleLegend">Toggle Legend</button>

<div id="legend">

<h3>Categories</h3>
<div><img src="images/wildlife.svg"> Wildlife</div>
<div><img src="images/crop.svg"> Crop</div>
<div><img src="images/livestock.svg"> Livestock</div>
<div><img src="images/farmersmarket.svg"> Farmers Market</div>
<div><img src="images/youth.svg"> Youth</div>
<div><img src="images/ageconomics.svg"> Ag Economics</div>

</div>

<h3>Results</h3>
<div id="results"></div>

</div>

<!-- MAP -->
<div id="map"></div>

<!-- PHOTO POPUP -->
<div id="photoPopup" class="photo-popup hidden">
    <div id="photoPopupContent"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<script src="script.js"></script>

</body>
</html>
